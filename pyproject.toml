[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foresight-media"
version = "0.1.0"
description = "Tool knowledge and bounded media qualification, using Crystal Ball"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2,<3",
  "crystal-ball-media @ https://github.com/gregoryhorn/crystal-ball/releases/download/v1.2.0/crystal_ball_media-1.2.0-py3-none-any.whl#sha256=e36da1fe33fd91b3971297682840ee3e893a5d8e7465ee9158d4c632a4fe7338",
]

[project.scripts]
foresight = "foresight.cli:main"

[tool.setuptools.packages.find]
include = ["foresight*"]

[tool.setuptools.data-files]
"share/foresight/hermes_plugin/foresight" = ["hermes_plugin/foresight/__init__.py", "hermes_plugin/foresight/plugin.yaml"]
